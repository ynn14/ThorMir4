<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NyomzkieTV - Thor MIR4 EU</title>
  <meta property="og:title" content="Thor MIR4 EU">
  <meta property="og:image" content="thor-mir4.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050b1a;
      --gold: #f6c244;
      --gold-soft: #b8903a;
      --text: #eaf1ff;
      --blue-1: #1d46c8;
      --blue-2: #3f7bff;
      --card: rgba(8, 18, 42, .82);
      --serif: "Cinzel", Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      position: relative;
      isolation: isolate;
    }
    /* Full-quality background artwork, only lightly darkened so it stays bright and sharp */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at center, rgba(5, 11, 26, .10) 0%, rgba(5, 11, 26, .55) 100%),
        url("thor-mir4-bg.jpg") center / cover no-repeat;
    }
    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.2rem, 9vw, 3.4rem);
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--gold);
      text-shadow: 0 0 18px rgba(246, 194, 68, .45), 0 2px 0 rgba(0, 0, 0, .6);
    }
    .banner {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 22px;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .75));
    }
    .card {
      padding: 16px;
      border: 1px solid var(--gold-soft);
      border-radius: 18px;
      background: var(--card);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.btn {
      display: block;
      padding: 15px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: .05em;
    }
    a.discord {
      background: #0c1a3d;
      color: var(--gold);
      border: 1px solid var(--gold-soft);
    }
    a.register {
      background: linear-gradient(180deg, var(--blue-2), var(--blue-1));
      color: #fff;
      border: 1px solid #9cc4ff;
    }
    a.btn:hover, a.btn:focus-visible { filter: brightness(1.2); outline: none; }
    a.btn:focus-visible { box-shadow: 0 0 0 3px var(--gold); }
  </style>
</head>
<body>
  <main>
    <h1>NyomzkieTV</h1>
    <img class="banner" src="thor-logo.png" alt="MIR4 Thor Mir official server opening logo" width="1100" height="636">
    <div class="card">
      <a class="btn discord" href="https://jeraldxxvi.github.io/Mir4ThorEU/thor-site.html">Website</a>
      <a class="btn discord" href="https://discord.gg/es52WRdaMD">Discord</a>
      <a class="btn register" href="https://account.thormir.com/register.html?ref=1020">Register your account now</a>
    </div>
  </main>
</body>
</html>
